    <style>
        :root {
            --bg-dark: #050508;
            --bg-card: rgba(12, 18, 30, 0.85);
            --neon-blue: #00f2ff;
            --neon-purple: #bc13fe;
            --neon-cyan: #00ffff;
            --neon-green: #00ff88;
            --text-main: #e2e8f0;
            --text-dim: #94a3b8;
            --glass-border: rgba(0, 242, 255, 0.18);
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 242, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(188, 19, 254, 0.08) 0%, transparent 40%);
        }

        /* Top Navigation */
        .client-nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .nav-brand span {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.6rem 1.3rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--neon-cyan);
            border: 1px solid var(--glass-border);
        }

        .btn-secondary:hover {
            background: rgba(0, 242, 255, 0.1);
            border-color: var(--neon-cyan);
            transform: translateY(-2px);
        }

        /* Client Switcher Carousel Bar */
        .client-switcher-wrap {
            padding: 1.5rem 5% 0.5rem 5%;
            max-width: 1400px;
            margin: 0 auto;
        }

        .switcher-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-dim);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .client-pills {
            display: flex;
            gap: 0.7rem;
            overflow-x: auto;
            padding-bottom: 0.8rem;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-blue) transparent;
        }

        .client-pill {
            flex-shrink: 0;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-dim);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .client-pill:hover {
            border-color: var(--neon-blue);
            color: #fff;
            background: rgba(0, 242, 255, 0.08);
        }

        .client-pill.active {
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.2), rgba(188, 19, 254, 0.2));
            border-color: var(--neon-cyan);
            color: #fff;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.25);
        }

        .client-pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-dim);
        }

        .client-pill.active .client-pill-dot {
            background: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan);
        }

        /* Main Content Container */
        .case-study-container {
            max-width: 1400px;
            margin: 1rem auto 4rem auto;
            padding: 0 5%;
        }

        /* Header Card */
        .client-header-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 2.5rem;
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.08);
        }

        .client-header-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple), var(--neon-cyan));
        }

        .client-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .client-headline h1 {
            font-size: 2.5rem;
            color: #fff;
            font-weight: 800;
            margin-bottom: 0.4rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .client-badge-pill {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            background: rgba(0, 242, 255, 0.12);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            font-weight: 600;
        }

        .client-location-tag {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--neon-green);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .client-industry {
            color: var(--text-dim);
            font-size: 1.05rem;
        }

        .client-services-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .service-tag {
            font-size: 0.8rem;
            padding: 0.35rem 0.85rem;
            border-radius: 15px;
            background: rgba(188, 19, 254, 0.12);
            border: 1px solid rgba(188, 19, 254, 0.3);
            color: #d8b4fe;
            font-weight: 500;
        }

        /* 3D LAPTOP MOCKUP CONTAINER */
        .laptop-showcase-section {
            margin: 3rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .laptop-section-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .laptop-section-header h2 {
            font-size: 2rem;
            color: #fff;
            margin-bottom: 0.5rem;
        }

        .laptop-section-header p {
            color: var(--text-dim);
            max-width: 600px;
        }

        /* Realistic CSS Laptop Frame */
        .laptop-wrapper {
            width: 100%;
            max-width: 1100px;
            perspective: 1200px;
            position: relative;
        }

        .laptop-screen-frame {
            background: #0f172a;
            border: 12px solid #1e293b;
            border-radius: 20px 20px 0 0;
            padding: 0;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 242, 255, 0.15);
            position: relative;
            overflow: hidden;
            border-bottom: none;
        }

        .laptop-camera-notch {
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #334155;
            border-radius: 50%;
            z-index: 10;
            box-shadow: inset 0 0 2px #000;
        }

        .laptop-screen-content {
            background: #060911;
            min-height: 520px;
            max-height: 650px;
            overflow-y: auto;
            padding: 2rem;
            color: var(--text-main);
            scrollbar-width: thin;
            scrollbar-color: var(--neon-blue) #0f172a;
        }

        .laptop-base {
            height: 18px;
            background: linear-gradient(180deg, #334155 0%, #1e293b 100%);
            border-radius: 0 0 15px 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.9);
            position: relative;
            display: flex;
            justify-content: center;
        }

        .laptop-base-notch {
            width: 140px;
            height: 6px;
            background: #0f172a;
            border-radius: 0 0 6px 6px;
        }

        /* Screen Inner Workspace */
        .screen-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .screen-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .screen-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .screen-stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .screen-stat-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(0, 242, 255, 0.1);
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .screen-stat-info h4 {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .screen-stat-info p {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
        }

        /* Case Study Details Grid */
        .case-study-details-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 2rem;
            margin-top: 2rem;
        }

        @media (max-width: 900px) {
            .case-study-details-grid {
                grid-template-columns: 1fr;
            }
        }

        .detail-block {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
        }

        .detail-title {
            font-size: 1.15rem;
            color: var(--neon-blue);
            font-weight: 700;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 0.5rem;
        }

        .detail-text {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .role-list {
            padding-left: 1.2rem;
            color: var(--text-dim);
            font-size: 0.95rem;
        }

        .role-list li {
            margin-bottom: 0.6rem;
            line-height: 1.5;
        }

        .results-card {
            background: linear-gradient(135deg, rgba(0, 242, 255, 0.08), rgba(188, 19, 254, 0.08));
            border: 1px solid var(--neon-cyan);
            border-radius: 16px;
            padding: 1.8rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.1);
        }

        .results-list {
            list-style: none;
        }

        .results-list li {
            position: relative;
            padding-left: 1.8rem;
            margin-bottom: 0.8rem;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .results-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            top: 0;
            color: var(--neon-cyan);
            font-weight: 900;
            font-size: 1.1rem;
        }

        .silver-button-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%);
            color: #0f172a;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        /* Footer */
        .client-footer {
            text-align: center;
            padding: 3rem 0;
            border-top: 1px solid var(--glass-border);
            color: var(--text-dim);
            font-size: 0.9rem;
        }
    </style>
</head>
